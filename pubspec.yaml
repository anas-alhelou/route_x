name: routex_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  # 🚨 CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter:
    sdk: flutter

  # Localization support for the application
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # -----------------------------------
  # UI & Design
  # -----------------------------------
  # Display vector graphics in SVG format
  flutter_svg: ^2.0.12

  # Download and cache images from the internet for faster loading
  cached_network_image: ^3.4.1

  # Add gradient borders to UI elements
  gradient_borders: ^1.0.2

  # OpenStreetMap / flutter_map integration
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # -----------------------------------
  # State Management
  # -----------------------------------
  # Application state management using the Bloc / Cubit pattern
  flutter_bloc: ^8.1.6

  # Help Bloc compare objects to prevent unnecessary UI rebuilds
  equatable: ^2.0.5

  # -----------------------------------
  # Core & Services
  # -----------------------------------

  # Lightweight local storage (e.g., saving login tokens or user state)
  shared_preferences: ^2.3.3

  # Check internet connection status (Wi-Fi or mobile data)
  connectivity_plus: ^6.1.0

  # Dependency injection container for Clean Architecture
  get_it: ^7.7.0

  # Declarative routing for Flutter
  go_router: ^12.1.3

  # Functional programming constructs for Clean Architecture (Either, Option, etc.)
  dartz: ^0.10.1

  # Responsive design adapting to different screen sizes and fonts
  flutter_screenutil: ^5.9.3

  # Pick images from gallery or camera
  image_picker: ^1.2.3

  # Pin code input for OTP and verification
  pinput: ^6.0.2

  # Custom fonts from Google Fonts
  google_fonts: ^8.2.1

  # Display SVG country flags easily
  country_flags: ^4.1.2

  # Render After Effects animations natively using Lottie
  lottie: ^3.1.3

  # Powerful HTTP client for API requests and networking
  dio: ^5.11.1

  # Secure local storage for sensitive data like access tokens
  flutter_secure_storage: ^11.0.0
  google_sign_in: ^7.2.0
  phone_numbers_parser: ^9.0.26
  permission_handler: 11.3.1

  # -----------------------------------
  # Onboarding motion
  # -----------------------------------
  # Micro-interactions (fade/slide reveals) for onboarding content
  flutter_animate: ^4.5.2

  # Page indicator (ExpandingDotsEffect) for onboarding
  smooth_page_indicator: ^3.0.0
  geolocator: ^14.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # System notifications with action buttons (new orders, ongoing route).
  flutter_local_notifications: ^19.4.0
  http: ^1.6.0
  camera: ^0.12.0+2
  url_launcher: ^6.3.0

dev_dependencies:
  # 🚨 CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_test:
    sdk: flutter

  # Recommended lints to encourage good coding practices
  flutter_lints: ^5.0.0

  # Mocking library for Dart testing
  mocktail: ^1.0.4

  # Testing library for Bloc and Cubit state management
  bloc_test: ^9.1.7

  # The supported seam for faking google_sign_in: in v7 the SDK itself is a
  # final singleton, so tests script the platform plugin it delegates to.
  google_sign_in_platform_interface: ^3.1.0

  # Tool to generate launcher icons for different platforms
  flutter_launcher_icons: ^0.14.4

  # Code generation tools (Updated versions to support Dart 3.10+ SDK build hooks)
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0

flutter:
  # 🚨 CRITICAL: Required for Material icon font - DO NOT REMOVE
  uses-material-design: true
  generate: true

  assets:
    # --- Images ---
    - assets/images/svg/
    - assets/images/png/
    - assets/images/jpg/
    # --- Icons ---
    - assets/icons/svg/
    - assets/icons/png/
    # --- Animations ---
    - assets/animations/

  fonts:
    # Latin family. Satoshi carries every Latin letter and digit in the app;
    # Arabic glyphs fall through to IBMPlexSansArabic below (see AppFonts).
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 100
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 200
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 600
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 800
        - asset: assets/fonts/satoshi/Satoshi-Black.otf
          weight: 900

    # Arabic family, used only as a fallback of Satoshi (never as a primary):
    # a glyph Satoshi has no outline for — the whole Arabic script — is taken
    # from here, while Latin letters and digits keep rendering in Satoshi even
    # inside a mixed Arabic/English string.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/core/config/constants/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
